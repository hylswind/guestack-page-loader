<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Loading…</title>
<style>
  /* Only locally installed fonts: the loader fetches nothing but the manifest and the page. */
  :root {
    --paper: #f3f0e8;
    --ink: #1d1c1a;
    --muted: #77736a;
    --rule: #d9d4c7;
    --wait: #8a8578;
    --notice: #3f5a6b;
    --error: #b4441c;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151514;
      --ink: #e9e5dc;
      --muted: #8f8a7f;
      --rule: #2c2b28;
      --wait: #6f6b62;
      --notice: #8fb2c4;
      --error: #ec7a4f;
    }
  }

  html { background: var(--paper); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    /* Slightly above centre and left of centre: a slip, not a splash screen. */
    grid-template-rows: 38fr auto 62fr;
    grid-template-columns: minmax(1.25rem, 1fr) minmax(0, 30rem) minmax(1.25rem, 1.6fr);
    color: var(--ink);
    background: var(--paper);
    font: 400 1.0625rem/1.55 var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  /* Place the <noscript> element itself; never change its display. With scripting on,
     its content is raw text that the browser hides only through display: none. */
  noscript { grid-row: 2; grid-column: 2; }

  #status, .noscript {
    grid-row: 2;
    grid-column: 2;
    margin: 0;
    padding: 0.15rem 0 0.2rem 1.25rem;
    border-left: 2px solid var(--accent, var(--wait));
    font-size: clamp(1.25rem, 1.05rem + 0.9vw, 1.6rem);
    line-height: 1.35;
    letter-spacing: -0.005em;
    text-wrap: balance;
    position: relative;
  }

  /* State label, drawn by CSS so the script only ever sets a class and textContent. */
  #status::before, .noscript::before {
    display: block;
    margin-bottom: 0.7rem;
    font: 500 0.6875rem/1 var(--mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent, var(--wait));
  }

  #status.loading { --accent: var(--wait); color: var(--muted); animation: appear 0.5s ease-out 0.35s both; }
  #status.loading::before { content: "Verifying"; content: "Verifying" / ""; }
  #status.notice  { --accent: var(--notice); }
  #status.notice::before { content: "No page"; content: "No page" / ""; }
  #status.error   { --accent: var(--error); }
  #status.error::before { content: "Not loaded"; content: "Not loaded" / ""; }
  .noscript { --accent: var(--error); }
  .noscript::before { content: "Not loaded"; content: "Not loaded" / ""; }

  #status.notice, #status.error { animation: settle 0.28s ease-out both; }

  /* While loading, a short segment travels down the rule. */
  #status.loading::after {
    content: "";
    position: absolute;
    left: -2px;
    top: 0;
    width: 2px;
    height: 30%;
    background: var(--ink);
    animation: travel 1.4s cubic-bezier(0.6, 0, 0.4, 1) infinite;
  }

  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @keyframes settle { from { opacity: 0; transform: translateY(0.25rem); } to { opacity: 1; transform: none; } }
  @keyframes travel { 0% { top: 0; height: 0; } 50% { height: 40%; } 100% { top: 100%; height: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #status, #status::after { animation: none !important; }
  }
</style>
</head>
<body>
<p id="status" class="loading" role="status">Loading…</p>
<noscript>
<style>#status { display: none; }</style>
<p class="noscript">This page requires JavaScript.</p>
</noscript>
<script>
(async () => {
  "use strict";

  const CDN_BASE_URL = "https://pub-b4866f87b3c64d11be815db6b70efe19.r2.dev/";

  const PAGE_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
  const HEX_RE = /^[0-9a-f]{64}$/;

  // Messages are set with textContent only, never parsed as HTML.
  const show = (cls, msg) => {
    const el = document.getElementById("status");
    el.className = cls;
    el.textContent = msg;
  };
  const notice = (msg) => show("notice", msg);
  const fail = (msg) => show("error", msg);

  // One leading slash and one optional trailing slash are stripped.
  // Anything that is not a single valid segment is rejected below.
  const page = location.pathname.replace(/^\//, "").replace(/\/$/, "");
  if (!page) {
    notice("No page specified. Please open the full link you were given.");
    return;
  }

  try {
    // Validated before any request. The page name is only a lookup key
    // and is never used to build a URL.
    if (!PAGE_RE.test(page)) {
      fail("Invalid page.");
      return;
    }

    // One manifest per UTC month (manifests/YYYYMM.json), chosen by the visitor's clock.
    const now = new Date();
    const month = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, "0")}`;

    const mRes = await fetch(`${CDN_BASE_URL}manifests/${month}.json`, {
      cache: "no-cache",
      mode: "cors",
      credentials: "omit",
    });
    if (!mRes.ok) {
      fail("Unable to look up the page.");
      return;
    }

    let manifest;
    try {
      manifest = await mRes.json();
    } catch {
      fail("Unable to look up the page.");
      return;
    }

    // The manifest is untrusted input. Only pages.<name>.sha256 is read.
    const pages = manifest !== null && typeof manifest === "object" ? manifest.pages : undefined;
    if (pages === null || typeof pages !== "object" || Array.isArray(pages)) {
      fail("Unable to look up the page.");
      return;
    }
    if (!Object.hasOwn(pages, page)) {
      fail("Page not found.");
      return;
    }
    const entry = pages[page];
    const hex = entry !== null && typeof entry === "object" ? entry.sha256 : undefined;
    if (typeof hex !== "string" || !HEX_RE.test(hex)) {
      fail("Invalid checksum.");
      return;
    }

    const bytes = hex.match(/../g).map((h) => parseInt(h, 16));
    const b64 = btoa(String.fromCharCode(...bytes));

    // fetch() rejects if the body does not match the integrity value.
    // This is the only verification path; there is no fallback.
    const res = await fetch(`${CDN_BASE_URL}blobs/${hex}.html`, {
      integrity: `sha256-${b64}`,
      mode: "cors",
      credentials: "omit",
    });
    if (!res.ok) {
      fail("Page content is unavailable.");
      return;
    }
    const html = await res.text();

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    fail("Failed to load the page.");
    console.error(e);
  }
})();
</script>
</body>
</html>
